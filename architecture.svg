<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="700" height="500" fill="#ffffff"/>

  <!-- Browser -->
  <rect x="70" y="40" width="290" height="60" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="215" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Browser client</text>
  <text x="215" y="84" text-anchor="middle" font-size="12" fill="#4b5563">index.html · style.css · app.js</text>

  <line x1="215" y1="100" x2="215" y2="158" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="132" font-size="11.5" fill="#374151">HTTP requests (JSON)</text>

  <!-- Flask -->
  <rect x="70" y="158" width="290" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="215" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Flask web server</text>
  <text x="215" y="202" text-anchor="middle" font-size="12" fill="#1e3a8a">Auth · sessions · REST API</text>

  <line x1="215" y1="218" x2="215" y2="276" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="250" font-size="11.5" fill="#374151">TCP protocol commands</text>

  <!-- Tracker -->
  <rect x="70" y="276" width="290" height="60" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="215" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">C++ tracker server</text>
  <text x="215" y="320" text-anchor="middle" font-size="12" fill="#4c1d95">Port 8080 · peer registry</text>

  <line x1="215" y1="336" x2="215" y2="394" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="368" font-size="11.5" fill="#374151">Issues transfer token</text>

  <!-- Peer file server -->
  <rect x="70" y="394" width="290" height="60" rx="10" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1"/>
  <text x="215" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">C++ peer file server</text>
  <text x="215" y="438" text-anchor="middle" font-size="12" fill="#115e59">Port 8081 · TLS transfers</text>

  <!-- File storage -->
  <rect x="440" y="240" width="200" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="540" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">File storage</text>
  <text x="540" y="300" text-anchor="middle" font-size="12" fill="#78350f">uploads/ on disk</text>

  <path d="M360 195 L440 275" fill="none" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4 3"/>
  <path d="M360 432 L440 320" fill="none" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4 3"/>
</svg>
