<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P File Transfer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 P2P File Transfer System</h1>
            <div class="status" id="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </header>

        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="setup">⚙️ Setup</button>
            <button class="tab-btn" data-tab="upload">📤 Upload</button>
            <button class="tab-btn" data-tab="files">📋 Files</button>
            <button class="tab-btn" data-tab="room">💬 Room</button>
        </div>

        <div class="main-content">
            <!-- Setup Tab: Account + Connection -->
            <div class="tab-panel active" id="tab-setup">
                <div class="panel auth-panel">
                    <h2>Account</h2>
                    <div class="form-group">
                        <label for="username">Username:</label>
                        <input type="text" id="username" autocomplete="username" placeholder="Enter username">
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" autocomplete="current-password" placeholder="At least 8 characters">
                    </div>
                    <button id="loginBtn" class="btn btn-primary">Login</button>
                    <button id="registerBtn" class="btn btn-secondary">Register</button>
                    <button id="logoutBtn" class="btn btn-secondary" disabled>Logout</button>
                    <p id="authStatus" class="auth-status">Not authenticated</p>
                </div>

                <div class="panel">
                    <h2>📡 Connection</h2>
                    <div class="form-group">
                        <label for="peerId">Your Peer ID:</label>
                        <input type="text" id="peerId" placeholder="Enter your unique ID" value="">
                    </div>
                    <div class="form-group">
                        <label for="serverAddress">Server Address:</label>
                        <input type="text" id="serverAddress" placeholder="localhost:5000" value="localhost:5000">
                    </div>
                    <button id="connectBtn" class="btn btn-primary">Connect</button>
                    <button id="disconnectBtn" class="btn btn-secondary" disabled>Disconnect</button>
                </div>
            </div>

            <!-- Upload Tab -->
            <div class="tab-panel" id="tab-upload">
                <div class="panel">
                    <h2>📤 Upload File</h2>
                    <div class="upload-area" id="uploadArea">
                        <input type="file" id="fileInput" accept="*/*" multiple>
                        <div class="upload-text">
                            <p>📁 Click to select files or drag & drop</p>
                            <p class="upload-hint">You can upload multiple files</p>
                        </div>
                    </div>
                    <div id="uploadProgress" class="progress-container" style="display: none;">
                        <div class="progress-bar">
                            <div id="progressBar" class="progress-fill"></div>
                        </div>
                        <span id="progressText">0%</span>
                    </div>
                    <button id="uploadBtn" class="btn btn-success" disabled>Upload Selected Files</button>
                </div>
            </div>

            <!-- Files Tab: Available + My Shared -->
            <div class="tab-panel" id="tab-files">
                <div class="panel">
                    <h2>📋 Available Files</h2>
                    <button id="refreshBtn" class="btn btn-secondary" disabled>🔄 Refresh List</button>
                    <div id="filesList" class="files-list">
                        <p class="empty-state">Connect to server to see available files</p>
                    </div>
                </div>

                <div class="panel">
                    <h2>📦 My Shared Files</h2>
                    <div id="myFilesList" class="files-list">
                        <p class="empty-state">No files shared yet</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Room Tab: Create/Join + Chat -->
        <div class="tab-panel" id="tab-room">
            <div class="panel room-join-panel" id="roomJoinPanel">
                <h2>💬 Rooms</h2>
                <div class="form-group">
                    <label for="roomName">Room Name (for creating):</label>
                    <input type="text" id="roomName" placeholder="e.g. Study Group">
                </div>
                <button id="createRoomBtn" class="btn btn-primary">➕ Create Room</button>
                <div class="form-group" style="margin-top: 20px;">
                    <label for="roomIdInput">Room ID (to join):</label>
                    <input type="text" id="roomIdInput" placeholder="e.g. AB3K9Z" maxlength="10" style="text-transform: uppercase;">
                </div>
                <button id="joinRoomBtn" class="btn btn-secondary">🚪 Join Room</button>
                <p id="roomStatus" class="auth-status"></p>
            </div>

            <div class="panel room-chat-panel" id="roomChatPanel" style="display: none;">
                <h2>Room: <span id="currentRoomName"></span> (<span id="currentRoomId"></span>)</h2>
                <button id="leaveRoomBtn" class="btn btn-secondary">🚪 Leave Room</button>
                <div class="room-members" id="roomMembers"></div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-row">
                    <input type="file" id="roomFileInput" style="display:none;">
                    <button id="roomFileBtn" class="btn btn-secondary" type="button" title="Share a file">📎</button>
                    <input type="text" id="chatInput" placeholder="Type a message..." maxlength="1000">
                    <button id="sendChatBtn" class="btn btn-primary">Send</button>
                </div>
            </div>
        </div>

        <!-- Activity Log
        <div class="panel log-panel">
            <h2>📝 Activity Log</h2>
            <div id="activityLog" class="activity-log"></div>
        </div> -->
    </div>

    <script>
        // Set the backend URL for when frontend and backend are on different domains.
        // For local/same-origin: leave unset, app.js defaults to window.location.origin
        // For GitHub Pages + Render: set window.P2P_BACKEND_URL = 'https://your-render-app.onrender.com'
        // window.P2P_BACKEND_URL = 'https://your-backend-url.onrender.com';
    </script>
    <script src="app.js"></script>
</body>
</html>
